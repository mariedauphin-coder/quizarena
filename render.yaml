# One-click deploy to Render (https://render.com): New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: quizarena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
      - key: JWT_SECRET
        generateValue: true
      # To switch on the AI question generator, add AI_API_KEY in the Render
      # dashboard (Environment tab). Never commit the key to GitHub.
